<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quote Desk — поиск предложений по P/N</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a222c;
      --bg2: #243040;
      --line: rgba(232, 220, 196, 0.12);
      --text: #f2ebe0;
      --muted: #9aa8b5;
      --accent: #c4a35a;
      --accent-dim: rgba(196, 163, 90, 0.15);
      --ok: #6fbf8a;
      --warn: #d4a574;
      --danger: #d98b8b;
      --radius: 10px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(196, 163, 90, 0.12), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(80, 120, 150, 0.18), transparent 50%),
        linear-gradient(180deg, var(--bg0), #121820 40%, var(--bg0));
    }

    .wrap {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3.5rem;
    }

    header.hero {
      display: grid;
      gap: 0.65rem;
      margin-bottom: 1.75rem;
      animation: rise 0.55s ease both;
    }
    .brand {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand span { color: var(--accent); }
    .lede {
      color: var(--muted);
      max-width: 42rem;
      font-size: 1.02rem;
      line-height: 1.45;
    }

    .panel {
      background: linear-gradient(180deg, rgba(36, 48, 64, 0.92), rgba(26, 34, 44, 0.96));
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      animation: rise 0.65s ease both;
      animation-delay: 0.05s;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    textarea, input[type="number"] {
      width: 100%;
      background: rgba(15, 20, 25, 0.7);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: var(--radius);
      padding: 0.85rem 0.95rem;
      font: 500 0.98rem/1.4 "IBM Plex Mono", monospace;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus, input[type="number"]:focus {
      border-color: rgba(196, 163, 90, 0.55);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    textarea { min-height: 140px; resize: vertical; }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.85rem;
      align-items: end;
      margin-top: 0.9rem;
    }
    .limit-box { width: 8.5rem; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 1rem;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      font: 600 0.95rem/1 "DM Sans", sans-serif;
      padding: 0.85rem 1.15rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s, opacity 0.2s;
    }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.55; cursor: wait; }

    .btn-primary {
      background: linear-gradient(180deg, #d4b56e, var(--accent));
      color: #1a150a;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.04); }

    .status {
      min-height: 1.4rem;
      margin-top: 0.85rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .spinner {
      display: inline-block;
      width: 0.85rem;
      height: 0.85rem;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
      margin-right: 0.4rem;
    }

    #results { margin-top: 1.5rem; display: grid; gap: 1.1rem; }

    .pn-block {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(15, 20, 25, 0.45);
      overflow: hidden;
      animation: rise 0.45s ease both;
    }
    .pn-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(196, 163, 90, 0.06);
    }
    .pn-title {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 1.05rem;
    }
    .meta { color: var(--muted); font-size: 0.88rem; }

    .quote {
      padding: 0.95rem 1rem;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 0.35rem;
    }
    .quote:last-child { border-bottom: 0; }
    .quote-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.8rem;
      align-items: baseline;
    }
    .supplier { font-weight: 650; }
    .price {
      font-family: "IBM Plex Mono", monospace;
      color: var(--accent);
      font-weight: 500;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.18rem 0.45rem;
      border-radius: 5px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      font-family: "IBM Plex Mono", monospace;
    }
    .snippet, .subject {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.4;
    }
    .empty {
      padding: 1rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .tsv-box {
      margin-top: 0.25rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(15, 20, 25, 0.55);
      overflow: hidden;
      animation: rise 0.5s ease both;
    }
    .tsv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--line);
    }
    .tsv-head h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 650;
    }
    pre#tsv {
      margin: 0;
      padding: 1rem;
      overflow: auto;
      max-height: 260px;
      font: 400 0.78rem/1.45 "IBM Plex Mono", monospace;
      color: #e8dcc4;
      white-space: pre;
    }

    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #243040;
      border: 1px solid rgba(196, 163, 90, 0.4);
      color: var(--text);
      padding: 0.7rem 0.95rem;
      border-radius: 8px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .row { grid-template-columns: 1fr; }
      .limit-box { width: 100%; }
      .wrap { width: min(100% - 1.25rem, 1120px); padding-top: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="brand">Quote <span>Desk</span></div>
      <p class="lede">Введите партийный номер — или несколько столбцом. Система проверит Gmail и соберёт предложения в формате колонок O–AA таблицы ТУЗ.</p>
    </header>

    <section class="panel">
      <label for="pns">Партийные номера</label>
      <textarea id="pns" placeholder="Вставьте P/N — один или несколько, каждый с новой строки" spellcheck="false"></textarea>

      <div class="row">
        <div class="limit-box">
          <label for="limit">Писем / P/N</label>
          <input id="limit" type="number" min="5" max="80" value="40" />
        </div>
        <div class="actions" style="margin-top:0">
          <button class="btn-primary" id="searchBtn" type="button">Найти предложения</button>
          <button class="btn-ghost" id="copyBtn" type="button" disabled>Копировать TSV</button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <div id="results"></div>

    <section class="tsv-box" id="tsvSection" hidden>
      <div class="tsv-head">
        <h2>TSV для ТУЗ (O → AA)</h2>
        <button class="btn-ghost" id="copyBtn2" type="button">Копировать</button>
      </div>
      <pre id="tsv"></pre>
    </section>
  </div>

  <div class="toast" id="toast">Скопировано</div>

  <script>
    const pnsEl = document.getElementById("pns");
    const limitEl = document.getElementById("limit");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const tsvSection = document.getElementById("tsvSection");
    const tsvEl = document.getElementById("tsv");
    const searchBtn = document.getElementById("searchBtn");
    const copyBtn = document.getElementById("copyBtn");
    const copyBtn2 = document.getElementById("copyBtn2");
    const toast = document.getElementById("toast");

    let lastTsv = "";

    function money(v) {
      if (v == null) return "цена ?";
      return "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    async function copyTsv() {
      if (!lastTsv) return;
      try {
        await navigator.clipboard.writeText(lastTsv);
        showToast("TSV скопирован — вставляйте в ТУЗ (O–AA)");
      } catch {
        tsvEl.focus();
        const range = document.createRange();
        range.selectNodeContents(tsvEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        showToast("Выделите и скопируйте вручную (Ctrl/Cmd+C)");
      }
    }

    function render(data) {
      resultsEl.innerHTML = "";
      data.results.forEach((block, idx) => {
        const el = document.createElement("article");
        el.className = "pn-block";
        el.style.animationDelay = `${idx * 0.04}s`;

        const head = document.createElement("div");
        head.className = "pn-head";
        head.innerHTML = `
          <div class="pn-title">${block.pn}</div>
          <div class="meta">писем: ${block.mail_hits} · предложений: ${block.quote_count}</div>
        `;
        el.appendChild(head);

        if (!block.quotes.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Предложений с ценой не найдено (или только внутренние письма).";
          el.appendChild(empty);
        } else {
          block.quotes.forEach((q) => {
            const row = document.createElement("div");
            row.className = "quote";
            row.innerHTML = `
              <div class="quote-top">
                <span class="supplier">${escapeHtml(q.supplier || "—")}</span>
                <span class="price">${money(q.price)}</span>
                <span class="chip">Cond ${escapeHtml(q.cond || "?")}</span>
                <span class="chip">Qty ${escapeHtml(q.qty || "?")}</span>
                <span class="chip">LT ${escapeHtml(q.lead_time || "?")}</span>
                <span class="chip">${escapeHtml(q.date || "?")}</span>
              </div>
              ${q.cert ? `<div class="meta">Cert: ${escapeHtml(q.cert)}</div>` : ""}
              <div class="subject">${escapeHtml(q.subject || "")}</div>
              <div class="snippet">${escapeHtml((q.snippet || "").replace(/\s+/g, " ").slice(0, 220))}</div>
            `;
            el.appendChild(row);
          });
        }
        resultsEl.appendChild(el);
      });

      lastTsv = data.tsv || "";
      tsvEl.textContent = lastTsv;
      tsvSection.hidden = !lastTsv;
      copyBtn.disabled = !lastTsv;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function runSearch() {
      const pns = pnsEl.value.trim();
      if (!pns) {
        statusEl.className = "status error";
        statusEl.textContent = "Введите партийный номер.";
        return;
      }
      searchBtn.disabled = true;
      copyBtn.disabled = true;
      statusEl.className = "status";
      statusEl.innerHTML = '<span class="spinner"></span>Ищу в Gmail… это может занять 10–60 секунд';
      resultsEl.innerHTML = "";
      tsvSection.hidden = true;

      try {
        const res = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pns, limit: Number(limitEl.value) || 40 }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Ошибка поиска");
        statusEl.className = "status ok";
        statusEl.textContent = `Готово: ${data.total_quotes} предложений по ${data.results.length} P/N`;
        render(data);
      } catch (err) {
        statusEl.className = "status error";
        statusEl.textContent = err.message || String(err);
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener("click", runSearch);
    copyBtn.addEventListener("click", copyTsv);
    copyBtn2.addEventListener("click", copyTsv);
    pnsEl.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runSearch();
    });
  </script>
</body>
</html>
